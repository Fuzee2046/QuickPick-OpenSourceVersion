# Copy this file to application.yaml or application-dev.yaml locally, then replace every placeholder.
spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/quickpick_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:quickpick}
    password: ${DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me}
  merchant-expiration: ${JWT_MERCHANT_EXPIRATION:31536000000}
  user-expiration: ${JWT_USER_EXPIRATION:157680000000}
  admin-expiration: ${JWT_ADMIN_EXPIRATION:28800000}

wechat:
  miniapp:
    appid: ${WECHAT_APP_ID:wx_mock_appid_replace_me}
    secret: ${WECHAT_APP_SECRET:wx_mock_secret_replace_me}

tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:replace-me}
    secret-key: ${TENCENT_COS_SECRET_KEY:replace-me}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    bucket: ${TENCENT_COS_BUCKET:replace-me}
    base-url: ${TENCENT_COS_BASE_URL:http://127.0.0.1:8080/uploads}

alipay:
  pay:
    enabled: ${ALIPAY_PAY_ENABLED:false}
    app-id: ${ALIPAY_APP_ID:replace-me}
    seller-id: ${ALIPAY_SELLER_ID:}
    merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    notify-url: ${ALIPAY_NOTIFY_URL:}
    return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/#/billing}
    gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}

quickpick:
  redis:
    enabled: true
    cache-enabled: true
    idempotency-enabled: true
    scheduler-lock-enabled: true
    key-prefix: quickpick

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
